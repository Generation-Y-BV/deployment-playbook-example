name: Deploy (gated by Deployment Playbook)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      plan_id:
        description: Reuse an existing Deployment Playbook plan id (empty = create/reuse a plan for this ref from PLAYBOOK_TEMPLATE)
        required: false
        type: string
      timeout_minutes:
        description: Minutes to wait per gate
        required: false
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TIMEOUT_MINUTES: ${{ inputs.timeout_minutes || '60' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  create-plan:
    runs-on: ubuntu-latest
    outputs:
      plan-id: ${{ steps.plan.outputs.plan-id }}
      plan-url: ${{ steps.plan.outputs.plan-url }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the given plan id
        if: ${{ inputs.plan_id != '' && inputs.plan_id != null }}
        id: given
        env:
          PLAN_ID: ${{ inputs.plan_id }}
          PB_URL: ${{ vars.PLAYBOOK_URL }}
        run: |
          echo "plan-id=$PLAN_ID" >> "$GITHUB_OUTPUT"
          echo "Using existing plan \`$PLAN_ID\` (${PB_URL%/})" >> "$GITHUB_STEP_SUMMARY"
      - name: Create plan from template
        if: ${{ inputs.plan_id == '' || inputs.plan_id == null }}
        id: create
        uses: ./.github/actions/create-playbook-plan
        with:
          playbook-url: ${{ vars.PLAYBOOK_URL }}
          api-token: ${{ secrets.PLAYBOOK_API_TOKEN }}
          template: ${{ vars.PLAYBOOK_TEMPLATE }}
          ref: ${{ github.ref_name }}
          vercel-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
      - id: plan
        env:
          GIVEN: ${{ steps.given.outputs.plan-id }}
          CREATED: ${{ steps.create.outputs.plan-id }}
          URL: ${{ steps.create.outputs.plan-url }}
        run: |
          echo "plan-id=${GIVEN:-$CREATED}" >> "$GITHUB_OUTPUT"
          echo "plan-url=$URL" >> "$GITHUB_OUTPUT"

  before:
    needs: [test, create-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wait-for-playbook
        with:
          playbook-url: ${{ vars.PLAYBOOK_URL }}
          plan-id: ${{ needs.create-plan.outputs.plan-id }}
          # phase=during is allowed once every Before step is approved/skipped
          phase: during
          api-token: ${{ secrets.PLAYBOOK_API_TOKEN }}
          vercel-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
          timeout-minutes: ${{ env.TIMEOUT_MINUTES }}

  deploy:
    needs: [create-plan, before]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (dummy)
        run: echo "Deploying ${GITHUB_SHA} ... done (replace with your real deploy)."

  during:
    needs: [create-plan, before]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wait-for-playbook
        with:
          playbook-url: ${{ vars.PLAYBOOK_URL }}
          plan-id: ${{ needs.create-plan.outputs.plan-id }}
          # phase=after is allowed once every During step is approved/skipped
          phase: after
          api-token: ${{ secrets.PLAYBOOK_API_TOKEN }}
          vercel-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
          timeout-minutes: ${{ env.TIMEOUT_MINUTES }}

  after-deployment:
    needs: [create-plan, deploy, during]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # phase=after only says "after-phase work may start"; require-done waits until
      # planStatus == "done", i.e. every step (incl. After deployment) is approved/skipped.
      - uses: ./.github/actions/wait-for-playbook
        with:
          playbook-url: ${{ vars.PLAYBOOK_URL }}
          plan-id: ${{ needs.create-plan.outputs.plan-id }}
          phase: after
          require-done: "true"
          api-token: ${{ secrets.PLAYBOOK_API_TOKEN }}
          vercel-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
          timeout-minutes: ${{ env.TIMEOUT_MINUTES }}
