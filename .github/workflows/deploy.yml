name: Deploy (gated by Deployment Playbook)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plan_id:
        description: Deployment Playbook plan id (defaults to repo variable PLAYBOOK_PLAN_ID)
        required: false
        type: string
      timeout_minutes:
        description: Minutes to wait per gate
        required: false
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAN_ID: ${{ inputs.plan_id || vars.PLAYBOOK_PLAN_ID }}
  TIMEOUT_MINUTES: ${{ inputs.timeout_minutes || '60' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  before:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wait-for-playbook
        with:
          playbook-url: ${{ vars.PLAYBOOK_URL }}
          plan-id: ${{ env.PLAN_ID }}
          phase: before
          api-token: ${{ secrets.PLAYBOOK_API_TOKEN }}
          vercel-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
          timeout-minutes: ${{ env.TIMEOUT_MINUTES }}

  deploy:
    needs: before
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (dummy)
        run: echo "Deploying ${GITHUB_SHA} ... done (replace with your real deploy)."

  during:
    needs: before
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wait-for-playbook
        with:
          playbook-url: ${{ vars.PLAYBOOK_URL }}
          plan-id: ${{ env.PLAN_ID }}
          phase: during
          api-token: ${{ secrets.PLAYBOOK_API_TOKEN }}
          vercel-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
          timeout-minutes: ${{ env.TIMEOUT_MINUTES }}

  after-deployment:
    needs: [deploy, during]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # phase=after only says "after-phase work may start"; require-done waits until
      # planStatus == "done", i.e. every step (incl. After deployment) is approved/skipped.
      - uses: ./.github/actions/wait-for-playbook
        with:
          playbook-url: ${{ vars.PLAYBOOK_URL }}
          plan-id: ${{ env.PLAN_ID }}
          phase: after
          require-done: "true"
          api-token: ${{ secrets.PLAYBOOK_API_TOKEN }}
          vercel-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
          timeout-minutes: ${{ env.TIMEOUT_MINUTES }}
